[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backend-agent"
version = "0.1.0"
description = "A backend-oriented asynchronous Agent service with LangGraph, MCP, RAG, SSE, Redis checkpoints, and RabbitMQ scheduling."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aio-pika>=10.0.1,<11",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "langgraph>=1.2.11,<2",
  "mcp>=2.2.0,<3",
  "pydantic-settings>=2.10,<3",
  "redis[hiredis]>=6.4,<7",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
