services:
  api:
    build: .
    command: ["uvicorn", "backend_agent.main:app", "--host", "0.0.0.0", "--port", "8080"]
    env_file: ${ENV_FILE:-.env}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - agent-data:/data
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "backend_agent.worker"]
    env_file: ${ENV_FILE:-.env}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mcp:
        condition: service_started
    volumes:
      - agent-data:/data
    restart: unless-stopped

  mcp:
    build: .
    command: ["python", "-m", "backend_agent.mcp_server"]
    expose:
      - "8000"
    env_file: ${ENV_FILE:-.env}
    volumes:
      - agent-data:/data
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  agent-data:
  redis-data:
  rabbitmq-data:
